<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Космический Дед — Пинбол</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="title">
    <img src="title.png" alt="Космический Дед">
    <h1>КОСМИЧЕСКИЙ<br>ДЕД</h1>
  </div>
  <div id="hud">
    <span class="hud-item">СЧЁТ <b id="score">0</b></span>
    <span class="hud-item">РЕКОРД <b id="best">0</b></span>
    <span class="hud-item">ШАР <b id="ball">1</b>/3</span>
    <span class="hud-item">БОНУС <b id="mult">×1</b></span>
    <span class="hud-item rank">ЗВАНИЕ <b id="rank">КАДЕТ</b></span>
  </div>
  <canvas id="c"></canvas>
  <div id="hint">
    Левый флиппер: <b>Shift</b>/<b>Z</b> · Правый: <b>/</b> или <b>M</b> · Плунжер: удерживать <b>Пробел</b> · <b>R</b> — заново · <b>P</b> — пауза
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
